services:
  gatling:
    build: .
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3000}
      WS_URL: ${WS_URL:-}
      TOURNAMENT_ID: ${TOURNAMENT_ID:-204}
      TEST_DURATION_SECONDS: ${TEST_DURATION_SECONDS:-600}
      SPECTATOR_REQUESTS_PER_SECOND: ${SPECTATOR_REQUESTS_PER_SECOND:-3}
      LIVE_SCORE_VIEWERS: ${LIVE_SCORE_VIEWERS:-100}
      LIVE_SCORE_BROWSER_VIEWERS: ${LIVE_SCORE_BROWSER_VIEWERS:-1}
      VIEWER_RAMP_SECONDS: ${VIEWER_RAMP_SECONDS:-30}
      WS_PROBE_INTERVAL_SECONDS: ${WS_PROBE_INTERVAL_SECONDS:-10}
      WS_RESPONSE_TIMEOUT_SECONDS: ${WS_RESPONSE_TIMEOUT_SECONDS:-10}
      WS_MAX_P95_MS: ${WS_MAX_P95_MS:-1000}
      WS_UNMATCHED_BUFFER_SIZE: ${WS_UNMATCHED_BUFFER_SIZE:-1000}
      OPERATOR_MATCH_SECONDS: ${OPERATOR_MATCH_SECONDS:-50}
      OPERATOR_STAGGER_SECONDS: ${OPERATOR_STAGGER_SECONDS:-7}
      OPERATOR_MATCH_JITTER_SECONDS: ${OPERATOR_MATCH_JITTER_SECONDS:-10}
      BROWSER_DOM_MAX_P95_MS: ${BROWSER_DOM_MAX_P95_MS:-250}
      BROWSER_DELIVERY_MAX_P95_MS: ${BROWSER_DELIVERY_MAX_P95_MS:-1000}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-test@test.com}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-password}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1gb"
    volumes:
      - ./results:/loadtests/results
