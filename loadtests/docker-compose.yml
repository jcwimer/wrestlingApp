services:
  gatling:
    build: .
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3000}
      WS_URL: ${WS_URL:-}
      TOURNAMENT_COUNT: ${TOURNAMENT_COUNT:-1}
      TEST_DURATION_SECONDS: ${TEST_DURATION_SECONDS:-600}
      PER_TOURNAMENT_SPECTATOR_REQUESTS_PER_SECOND: ${PER_TOURNAMENT_SPECTATOR_REQUESTS_PER_SECOND:-3}
      PER_TOURNAMENT_LIVE_SCORE_VIEWERS: ${PER_TOURNAMENT_LIVE_SCORE_VIEWERS:-20}
      PER_TOURNAMENT_LIVE_SCORE_BROWSER_VIEWERS: ${PER_TOURNAMENT_LIVE_SCORE_BROWSER_VIEWERS:-1}
      PER_TOURNAMENT_VIEWER_RAMP_SECONDS: ${PER_TOURNAMENT_VIEWER_RAMP_SECONDS:-30}
      PER_TOURNAMENT_WS_PROBE_INTERVAL_SECONDS: ${PER_TOURNAMENT_WS_PROBE_INTERVAL_SECONDS:-10}
      WS_RESPONSE_TIMEOUT_SECONDS: ${WS_RESPONSE_TIMEOUT_SECONDS:-10}
      WS_MAX_P95_MS: ${WS_MAX_P95_MS:-1000}
      WS_UNMATCHED_BUFFER_SIZE: ${WS_UNMATCHED_BUFFER_SIZE:-1000}
      PER_TOURNAMENT_OPERATOR_MATCH_SECONDS: ${PER_TOURNAMENT_OPERATOR_MATCH_SECONDS:-50}
      PER_TOURNAMENT_OPERATOR_CLOCK_START_DELAY_SECONDS: ${PER_TOURNAMENT_OPERATOR_CLOCK_START_DELAY_SECONDS:-10}
      PER_TOURNAMENT_OPERATOR_EVENT_INTERVAL_SECONDS: ${PER_TOURNAMENT_OPERATOR_EVENT_INTERVAL_SECONDS:-10}
      BROWSER_ACTION_TIMEOUT_SECONDS: ${BROWSER_ACTION_TIMEOUT_SECONDS:-120}
      OPERATOR_STAGGER_SECONDS: ${OPERATOR_STAGGER_SECONDS:-7}
      PER_TOURNAMENT_OPERATOR_MATCH_JITTER_SECONDS: ${PER_TOURNAMENT_OPERATOR_MATCH_JITTER_SECONDS:-10}
      BROWSER_DOM_MAX_P95_MS: ${BROWSER_DOM_MAX_P95_MS:-250}
      BROWSER_DELIVERY_MAX_P95_MS: ${BROWSER_DELIVERY_MAX_P95_MS:-1000}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-test@test.com}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-password}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1gb"
    volumes:
      - ./results:/loadtests/results
