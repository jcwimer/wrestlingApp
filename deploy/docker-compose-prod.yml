version: "3.3"
networks:
  database:
  caching:
  metrics:
  exporters:
    internal: true
  traefik:
    external:
      name: shared_traefik
  monitoring:
    external:
      name: shared_monitoring

volumes:
  jaeger:
  grafana:
  prometheus:

services:
  # This is used so plausible analytics aren't "external" to the app and get blocked
  nginx-proxy:
    image: nginx:stable-alpine
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx-entrypoint.sh:/nginx-entrypoint.sh
    entrypoint: /nginx-entrypoint.sh
    networks:
      traefik:
      caching:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx-proxy.entrypoints=web"
      - "traefik.http.routers.nginx-proxy.rule=Host(`wrestlingdev.com`)"
      - "traefik.http.middlewares.nginx-proxy-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.nginx-proxy.middlewares=nginx-proxy-https-redirect"
      #- "traefik.http.middlewares.nginx-proxy-x-forwarded-for.headers.hostsProxyHeaders='X-Forwarded-For'"
      #- "traefik.http.routers.nginx-proxy-secure.middlewares=nginx-proxy-x-forwarded-for"
      #- "traefik.http.middlewares.nginx-proxy-x-forwarded-for.headers.sslProxyHeaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.nginx-proxy-secure.entrypoints=websecure"
      - "traefik.http.routers.nginx-proxy-secure.rule=Host(`wrestlingdev.com`)"
      - "traefik.http.routers.nginx-proxy-secure.tls=true"
      - "traefik.http.routers.nginx-proxy-secure.tls.certresolver=mychallenge"
      - "traefik.http.routers.nginx-proxy-secure.service=nginx-proxy"
      - "traefik.http.services.nginx-proxy.loadbalancer.server.port=80"
      - "traefik.docker.network=shared_traefik"

  wrestlingdev:
    image: jcwimer/wrestlingdev:prod
    environment:
      - RAILS_ENV=production
      - WRESTLINGDEV_DB_NAME=wrestlingdev
      - WRESTLINGDEV_DB_USR=root
      - WRESTLINGDEV_DB_PWD=${MYSQL_PASSWORD}
      - WRESTLINGDEV_DB_HOST=wrestlingdev_db
      - WRESTLINGDEV_DB_PORT=3306
      - WRESTLINGDEV_DEVISE_SECRET_KEY=${DEVISE_SECRET_KEY}
      - WRESTLINGDEV_SECRET_KEY_BASE=${RAILS_SECRET_KEY}
      - WRESTLINGDEV_EMAIL=jacob.wimer@gmail.com
      - WRESTLINGDEV_EMAIL_PWD=${GMAIL_PASSWORD}
      - WRESTLINGDEV_MISSION_CONTROL_USER=admin
      - WRESTLINGDEV_MISSION_CONTROL_PASSWORD=${MISSION_CONTROL_PASSWORD}
      - SOLID_QUEUE_IN_PUMA=true
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - RAILS_MIN_THREADS=${RAILS_MIN_THREADS:-5}
      - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}
      - OTEL_SERVICE_NAME=wrestlingdev
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318

    networks:
      database:
      caching:
      metrics:
      #traefik:
    restart: always
    healthcheck:
      test: curl http://127.0.0.1/

  wrestlingdev_db:
    image: mariadb:10.10
    ports:
      - 10.147.17.240:3306:3306
    volumes:
      - ./mariadb/mysql-data:/var/lib/mysql
      - ./mariadb/backups:/backups
      - ./mariadb/70-mysettings.cnf:/etc/mysql/mariadb.conf.d/70-mysettings.cnf
      - ./mariadb/var-log-mariadb:/var/log/mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
    restart: always
    networks:
      database:
      exporters:
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mariadb -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    restart: always
    depends_on:
      - jaeger
    networks:
      metrics:
      monitoring:
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro

  jaeger-storage-init:
    image: jaegertracing/all-in-one:1.62.0
    user: "0:0"
    entrypoint: ["chown", "10001:0", "/badger"]
    network_mode: none
    volumes:
      - jaeger:/badger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    command:
      - --badger.ephemeral=false
      - --badger.directory-key=/badger/keys
      - --badger.directory-value=/badger/values
      - --badger.span-store-ttl=168h
    depends_on:
      jaeger-storage-init:
        condition: service_completed_successfully
    volumes:
      - jaeger:/badger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
    networks:
      metrics:
      monitoring:
      traefik:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.entrypoints=web"
      - "traefik.http.routers.jaeger.rule=Host(`${JAEGER_HOST}`)"
      - "traefik.http.middlewares.jaeger-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.jaeger.middlewares=jaeger-https-redirect"
      - "traefik.http.routers.jaeger-secure.entrypoints=websecure"
      - "traefik.http.routers.jaeger-secure.rule=Host(`${JAEGER_HOST}`)"
      - "traefik.http.routers.jaeger-secure.tls=true"
      - "traefik.http.routers.jaeger-secure.tls.certresolver=mychallenge"
      - "traefik.http.routers.jaeger-secure.service=jaeger"
      - "traefik.http.routers.jaeger-secure.middlewares=jaeger-auth"
      - "traefik.http.middlewares.jaeger-auth.basicauth.users=${JAEGER_BASIC_AUTH_USERS}"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
      - "traefik.docker.network=shared_traefik"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    restart: always
    networks:
      metrics:
      monitoring:
      exporters:
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    pid: host
    restart: always
    volumes:
      - /:/host:ro
    networks:
      exporters:

  mariadb-exporter-init:
    image: mariadb:10.10
    entrypoint: ["bash", "/init-exporter.sh"]
    environment:
      MYSQL_HOST: wrestlingdev_db
      MYSQL_PWD: ${MYSQL_PASSWORD}
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?Set MYSQLD_EXPORTER_PASSWORD in prod.env}
    volumes:
      - ./mariadb/init-exporter.sh:/init-exporter.sh:ro
    depends_on:
      wrestlingdev_db:
        condition: service_healthy
    networks:
      exporters:

  mariadb-exporter:
    image: prom/mysqld-exporter:v0.17.2
    command: ["--mysqld.address=wrestlingdev_db:3306", "--mysqld.username=exporter", "--config.my-cnf=/dev/null"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?Set MYSQLD_EXPORTER_PASSWORD in prod.env}
    restart: always
    depends_on:
      mariadb-exporter-init:
        condition: service_completed_successfully
    networks:
      exporters:

  grafana:
    image: grafana/grafana:12.1.1
    restart: always
    depends_on:
      - prometheus
      - jaeger
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      metrics:
      monitoring:
      traefik:
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST}`)"
      - "traefik.http.middlewares.grafana-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.grafana.middlewares=grafana-https-redirect"
      - "traefik.http.routers.grafana-secure.entrypoints=websecure"
      - "traefik.http.routers.grafana-secure.rule=Host(`${GRAFANA_HOST}`)"
      - "traefik.http.routers.grafana-secure.tls=true"
      - "traefik.http.routers.grafana-secure.tls.certresolver=mychallenge"
      - "traefik.http.routers.grafana-secure.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=shared_traefik"
