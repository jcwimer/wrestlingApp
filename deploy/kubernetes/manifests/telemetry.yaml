---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pv-claim
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrestlingdev
      component: grafana
  template:
    metadata:
      labels:
        app: wrestlingdev
        component: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.1.1
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: wrestlingdev-secrets
              key: grafana_admin_user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wrestlingdev-secrets
              key: grafana_admin_password
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources/datasources.yml
          subPath: datasources.yml
          readOnly: true
        - name: grafana-dashboard-providers
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
          subPath: dashboards.yml
          readOnly: true
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pv-claim
      - name: grafana-datasources
        configMap:
          name: grafana-provisioning
      - name: grafana-dashboard-providers
        configMap:
          name: grafana-provisioning
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  selector:
    app: wrestlingdev
    component: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wrestlingdev-jaeger-basic-auth
spec:
  basicAuth:
    secret: wrestlingdev-jaeger-basic-auth
