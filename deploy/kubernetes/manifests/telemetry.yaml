apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: wrestlingdev
    component: telemetry
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch:
    
    connectors:
      span_metrics:
        histogram:
          explicit:
            buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
        dimensions:
          - name: http.route
          - name: http.request.method
          - name: http.response.status_code
          - name: db.system
          - name: code.namespace
        exemplars:
          enabled: true
        aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
        metrics_flush_interval: 15s
    
    exporters:
      otlp_http/jaeger:
        endpoint: http://jaeger:4318
      prometheus:
        endpoint: 0.0.0.0:8889
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/jaeger, span_metrics]
        metrics:
          receivers: [span_metrics]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrestlingdev
      component: otel-collector
  template:
    metadata:
      labels:
        app: wrestlingdev
        component: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.153.0
        args:
          - --config=/etc/otelcol-contrib/config.yml
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 8889
          name: metrics
        volumeMounts:
        - name: otel-collector-config
          mountPath: /etc/otelcol-contrib/config.yml
          subPath: config.yml
          readOnly: true
      volumes:
      - name: otel-collector-config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  selector:
    app: wrestlingdev
    component: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: metrics
    port: 8889
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrestlingdev
      component: jaeger
  template:
    metadata:
      labels:
        app: wrestlingdev
        component: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.62.0
        args:
        - --memory.max-traces=50000
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        ports:
        - containerPort: 16686
          name: ui
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  selector:
    app: wrestlingdev
    component: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: ui
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: wrestlingdev
    component: telemetry
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8889"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pv-claim
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrestlingdev
      component: prometheus
  template:
    metadata:
      labels:
        app: wrestlingdev
        component: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        args:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.path=/prometheus
          - --storage.tsdb.retention.time=30d
          - --web.enable-lifecycle
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
          readOnly: true
        - name: prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: prometheus-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  selector:
    app: wrestlingdev
    component: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app: wrestlingdev
    component: telemetry
data:
  datasources.yml: |
    apiVersion: 1
    
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: true
  dashboards.yml: |
    apiVersion: 1
    
    providers:
      - name: WrestlingDev
        orgId: 1
        folder: WrestlingDev
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pv-claim
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrestlingdev
      component: grafana
  template:
    metadata:
      labels:
        app: wrestlingdev
        component: grafana
    spec:
      initContainers:
      - name: download-grafana-dashboards
        image: alpine:3.20
        command:
        - sh
        - -c
        - |
          set -eu
          githubraw_url=https://raw.githubusercontent.com/jcwimer/wrestlingApp/refs/heads/master
          for dashboard in \
            rails-otel-activejob.json \
            rails-otel-overview.json \
            rails-otel-performance-per-action.json \
            rails-otel-performance-per-request.json \
            rails-otel-performance.json \
            rails-otel-requests.json \
            rails-otel-slowlog-by-action.json \
            rails-otel-slowlog-by-request.json \
            rails-otel-slowlog-by-sql.json
          do
            wget -q -O "/var/lib/grafana/dashboards/${dashboard}" "${githubraw_url}/deploy/grafana/dashboards/${dashboard}"
          done
        volumeMounts:
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
      containers:
      - name: grafana
        image: grafana/grafana:12.1.1
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: wrestlingdev-secrets
              key: grafana_admin_user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wrestlingdev-secrets
              key: grafana_admin_password
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources/datasources.yml
          subPath: datasources.yml
          readOnly: true
        - name: grafana-dashboard-providers
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
          subPath: dashboards.yml
          readOnly: true
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pv-claim
      - name: grafana-datasources
        configMap:
          name: grafana-provisioning
      - name: grafana-dashboard-providers
        configMap:
          name: grafana-provisioning
      - name: grafana-dashboards
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  selector:
    app: wrestlingdev
    component: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wrestlingdev-jaeger-basic-auth
spec:
  basicAuth:
    secret: wrestlingdev-jaeger-basic-auth
