apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: wrestlingdev
    component: telemetry
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    
    processors:
      batch:
    
    connectors:
      span_metrics:
        histogram:
          explicit:
            buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
        dimensions:
          - name: http.route
          - name: http.request.method
          - name: http.response.status_code
          - name: db.system
          - name: code.namespace
        exemplars:
          enabled: true
        aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
        metrics_flush_interval: 15s
    
    exporters:
      otlp_http/jaeger:
        endpoint: http://jaeger:4318
      prometheus:
        endpoint: 0.0.0.0:8889
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/jaeger, span_metrics]
        metrics:
          receivers: [span_metrics]
          processors: [batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrestlingdev
      component: otel-collector
  template:
    metadata:
      labels:
        app: wrestlingdev
        component: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.153.0
        args:
          - --config=/etc/otelcol-contrib/config.yml
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 8889
          name: metrics
        volumeMounts:
        - name: otel-collector-config
          mountPath: /etc/otelcol-contrib/config.yml
          subPath: config.yml
          readOnly: true
      volumes:
      - name: otel-collector-config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  selector:
    app: wrestlingdev
    component: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: metrics
    port: 8889
    targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrestlingdev
      component: jaeger
  template:
    metadata:
      labels:
        app: wrestlingdev
        component: jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.62.0
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        ports:
        - containerPort: 16686
          name: ui
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  selector:
    app: wrestlingdev
    component: jaeger
  ports:
  - name: ui
    port: 16686
    targetPort: ui
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: wrestlingdev
    component: telemetry
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ["otel-collector:8889"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pv-claim
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrestlingdev
      component: prometheus
  template:
    metadata:
      labels:
        app: wrestlingdev
        component: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        args:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.path=/prometheus
          - --storage.tsdb.retention.time=30d
          - --web.enable-lifecycle
        ports:
        - containerPort: 9090
          name: http
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
          readOnly: true
        - name: prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: prometheus-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: wrestlingdev
    component: telemetry
spec:
  selector:
    app: wrestlingdev
    component: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app: wrestlingdev
    component: telemetry
data:
  datasources.yml: |
    apiVersion: 1
    
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: true
  dashboards.yml: |
    apiVersion: 1
    
    providers:
      - name: WrestlingDev
        orgId: 1
        folder: WrestlingDev
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
