networks:
  database:
  caching:
  metrics:

volumes:
  mysql:
  prometheus:
  grafana:
  
services:
  app:
    image: wrestlingdev
    build:
      context: ../
      dockerfile: ./deploy/rails-prod-Dockerfile
    environment:
      - RAILS_ENV=production
      - WRESTLINGDEV_DB_NAME=wrestlingtourney
      - WRESTLINGDEV_DB_USR=root
      - WRESTLINGDEV_DB_PWD=password
      - WRESTLINGDEV_DB_HOST=db
      - WRESTLINGDEV_DB_PORT=3306
      - WRESTLINGDEV_DEVISE_SECRET_KEY=2f29d49db6704377ba263f7cb9db085b386bcb301c0cd501126a674686ab1a109754071165b08cd72af03cec4642a4dd04361c994462254dd5d85e9594e8b9aa
      - WRESTLINGDEV_SECRET_KEY_BASE=077cdbef5c2ccf22543fb17a67339f234306b7fa2e1e4463d851c444c10a5611829a2290b253da78339427f131571fac9a42c83d960b2d25ecc10a4a0a7ce1a2
      - OTEL_SERVICE_NAME=wrestlingdev
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - SOLID_QUEUE_IN_PUMA=true
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - RAILS_MIN_THREADS=${RAILS_MIN_THREADS:-5}
      - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}
      - WRESTLINGDEV_MISSION_CONTROL_USER=dev
      - WRESTLINGDEV_MISSION_CONTROL_PASSWORD=secret
    networks:
      database:
      caching:
      metrics:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    healthcheck: 
      test: curl http://127.0.0.1/
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  db:
    image: mariadb:10.10
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - MYSQL_ROOT_PASSWORD=password
    restart: always
    networks:
      database:
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_PASSWORD
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol/config.yml"]
    depends_on:
      - jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      metrics:
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol/config.yml:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    command:
      - --memory.max-traces=50000
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
    networks:
      metrics:

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      metrics:
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
      - jaeger
    ports:
      - "3000:3000"
    networks:
      metrics:
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
