# Only needed if you cache the plausible script. Speeds things up.
# Note: to use the `proxy_cache` setup, you'll need to make sure the `/var/run/nginx-cache`
# directory exists (e.g. creating it in a build step with `mkdir -p /var/run/nginx-cache`)
# To make `/var/run/nginx-cache` persist during reboots of your server
# make sure to run `echo "D /run/nginx-cache 0755 root root -" > /usr/lib/tmpfiles.d/nginx-cache.conf`
#proxy_cache_path /var/run/nginx-cache/jscache levels=1:2 keys_zone=jscache:100m inactive=30d  use_temp_path=off max_size=100m;

server {
    listen 80;

    server_name  wrestlingdev.com;
    sendfile on;

    set_real_ip_from 172.22.0.0/16;
    real_ip_header X-Forwarded-For;

    default_type application/octet-stream;

    # Security Stuff
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options nosniff;
    server_tokens off;
    add_header Set-Cookie "Path=/; HttpOnly; Secure";


    gzip on;
    gzip_http_version 1.1;
    gzip_disable      "MSIE [1-6]\.";
    gzip_min_length   1100;
    gzip_vary         on;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level   9;

    location = /plausible/js/script.js {
        # Change this if you use a different variant of the script
        #proxy_pass https://plausible.wrestlingdev.com/js/script.js;
        proxy_pass http://plausible:8000/js/script.js;

        # for apis
        # remove /analytics from the request headed to the backend
        # rewrite /analytics/(.*) /$1  break;

        # Tiny, negligible performance improvement. Very optional.
        proxy_buffering on;

        # Cache the script for 6 hours, as long as plausible.io returns a valid response
        #proxy_cache jscache;
        #proxy_cache_valid 200 6h;
        #proxy_cache_use_stale updating error timeout invalid_header http_500;

        # Optional. Adds a header to tell if you got a cache hit or miss
        #add_header X-Cache $upstream_cache_status;

        proxy_set_header Host plausible.wrestlingdev.com;
        proxy_ssl_name plausible.wrestlingdev.com;
        proxy_ssl_server_name on;
        proxy_ssl_session_reuse off;
    }

    location = /plausible/api/event {
        #proxy_pass https://plausible.wrestlingdev.com/api/event;
        proxy_pass http://plausible:8000/api/event;

        proxy_buffering on;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Host plausible.wrestlingdev.com;
        proxy_ssl_name plausible.wrestlingdev.com;
        proxy_ssl_server_name on;
        proxy_ssl_session_reuse off;
    }

    location / {
        proxy_pass http://wrestlingdev;
    }
}