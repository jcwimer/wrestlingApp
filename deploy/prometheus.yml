global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: mariadb
    static_configs:
      - targets: ["mariadb-exporter:9104"]
